spring.application.name=cravedash
server.port=${PORT:8080}

# Use MEMORYDB_HOST for Amazon MemoryDB. For local Redis, leave it unset and use localhost.
spring.data.redis.host=${MEMORYDB_HOST:localhost}
spring.data.redis.port=${MEMORYDB_PORT:6379}
spring.data.redis.password=${MEMORYDB_PASSWORD:}
spring.data.redis.ssl.enabled=${MEMORYDB_SSL:false}
spring.data.redis.timeout=2s

spring.jackson.serialization.write-dates-as-timestamps=false

# Configure both bootstrap variables to enable the single application login account.
app.auth.bootstrap-username=${CRAVEDASH_AUTH_USERNAME:}
app.auth.bootstrap-password=${CRAVEDASH_AUTH_PASSWORD:}
app.auth.secure-cookie=${CRAVEDASH_SECURE_COOKIE:false}
app.frontend-origin=${CRAVEDASH_FRONTEND_ORIGIN:http://localhost:5173}
